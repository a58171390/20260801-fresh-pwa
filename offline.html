<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目前離線 - 鮮之源</title>
  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8FAFC;
      color: #292524;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #F0FDF4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { color: #78716C; font-size: 14px; line-height: 1.7; margin: 0 0 32px; }
    button {
      background: #2F855A;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #276749; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>目前處於離線狀態</h1>
    <p>無法連接網路，請檢查您的網路連線後再試一次。已瀏覽過的頁面內容仍可離線查看。</p>
    <button onclick="location.reload()">重新連線</button>
  </div>
</body>
</html>
